[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandapply"
version = "0.1.0"
description = "Local, policy-controlled job application assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pypdf>=5,<8", "python-docx>=1.1,<2", "reportlab>=4,<5", "python-multipart>=0.0.18,<1", "tzdata>=2024.1; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
pandapply = "pandapply.cli:main"

[tool.setuptools.package-data]
pandapply = ["migrations/*.sql", "assets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
